app:
  title: "ND Posture Guard"
  warning_text: "صاف بشین"

camera:
  device: "auto"
  width: 640
  height: 480
  fps: 30
  mirror: true

vision:
  detection_interval_ms: 100

  # Six manually marked shoulder anchors are used: three on each shoulder.
  # Normal tracking uses pyramidal Lucas-Kanade optical flow between consecutive frames.
  # Template matching is only a recovery path when optical-flow anchors are lost.
  shoulder_anchor_template_size_px: 25
  shoulder_anchor_search_radius_px: 48
  shoulder_anchor_recovery_search_radius_px: 190
  shoulder_anchor_minimum_match_confidence: 0.42

  # With 6 anchors, monitoring can continue with four valid anchors,
  # provided at least two remain on each shoulder. Missing anchors are predicted
  # from the robust motion of the remaining anchors on the same shoulder.
  shoulder_anchor_minimum_valid_anchors: 4
  shoulder_anchor_maximum_group_motion_residual_px: 22.0

  shoulder_anchor_optical_flow_window_px: 41
  shoulder_anchor_optical_flow_pyramid_levels: 4
  shoulder_anchor_forward_backward_error_px: 4.0

monitoring:
  # This value is saved immediately whenever it is changed in the GUI and is
  # restored on the next run.
  shoulder_drop_trigger_percent: 4.0
  shoulder_width_trigger_percent: 12.0
  shoulder_tilt_trigger_degrees: 12.0
  required_bad_frames: 5
  alert_cooldown_seconds: 3.0

alerts:
  sound_path: "assets/one_long_beep.wav"
  volume_percent: 100
