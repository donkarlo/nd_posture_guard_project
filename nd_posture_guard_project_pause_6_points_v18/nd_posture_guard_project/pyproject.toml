[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nd_posture_guard"
version = "0.18.0"
description = "Shoulder-only webcam posture monitoring with six-anchor optical-flow tracking, pause/resume, and automatic reacquisition."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.8,<7",
    "opencv-python>=5.0.0.93,<6",
    "PyYAML>=6.0,<7",
    "numpy>=1.26,<3",
]

[project.scripts]
nd-posture-guard = "nd_posture_guard.main:Main.run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
