app:
  title: "ND Posture Guard"
  warning_text: "صاف بشین"

camera:
  device: "auto"
  width: 640
  height: 480
  fps: 30
  mirror: true

vision:
  # Geometry tracking/classification runs at 10 Hz. UI delivery is capped separately at 8 FPS.
  detection_interval_ms: 100

# Persistent application/training data is intentionally OUTSIDE the project folder.
# Replacing the project source therefore does not replace your recordings.
data:
  root: "/home/donkarlo/Dropbox/repo/data/nd_posture_guard_project"

training:
  # Each GOOD/BAD sample uses 7 clicked landmarks and keeps about 3 seconds of review video.
  frames_per_sample: 30
  # Retained only so older settings files remain loadable; the seven-point model does not use ROI padding.
  roi_horizontal_padding_ratio: 0.14
  roi_vertical_padding_ratio: 0.55
  # Retained for settings compatibility; geometry-v1 does not use high-dimensional novelty tuning.
  novelty_multiplier: 4.5

monitoring:
  # 50% is the natural GOOD/BAD boundary. Higher = fewer beeps. The GUI value persists under data/runtime/.
  bad_score_threshold: 0.50
  k_neighbors: 3
  required_bad_frames: 5
  alert_cooldown_seconds: 3.0

alerts:
  sound_path: "assets/one_long_beep.wav"
  volume_percent: 100
